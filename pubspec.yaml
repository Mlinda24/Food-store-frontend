name: foodie_express_mobile
description: A food delivery mobile application with distance-based delivery fees and mobile money payments
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ============================================
  # GROUP 1: UI & STYLING
  # ============================================
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  badges: ^3.1.2
  lottie: ^3.1.0
  permission_handler: ^11.3.1

  # ============================================
  # GROUP 2: IMAGE HANDLING
  # ============================================
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  path: ^1.9.0
  cross_file: ^0.3.4+2

  # ============================================
  # GROUP 3: STATE MANAGEMENT & NAVIGATION
  # ============================================
  provider: ^6.1.2
  go_router: ^14.2.7

  # ============================================
  # GROUP 4: NETWORKING & LOCAL STORAGE
  # ============================================
  dio: ^5.7.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  url_launcher: ^6.3.1

  # ============================================
  # GROUP 5: NOTIFICATIONS, MAPS & LOCATION
  # ============================================
  flutter_local_notifications: ^17.2.4
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^13.0.2
  
  # ============================================
  # GROUP 6: FORMS, FONTS & WEBVIEW
  # ============================================
  # GROUP 6: FORMS, FONTS & WEBVIEW
  flutter_form_builder: ^10.0.1
  form_builder_validators: ^11.3.0
  google_fonts: ^6.2.1
  webview_flutter: ^4.4.0
  webview_flutter_android: ^3.12.0
  webview_flutter_wkwebview: ^3.9.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo.png
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
        - asset: assets/fonts/Poppins-BlackItalic.ttf
          weight: 900
          style: italic