name: foodie_express_mobile
description: A food delivery mobile application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI & Styling
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  badges: ^3.1.2
  lottie: ^2.7.0
  
  # State Management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^13.0.1
  
  # Networking
  dio: ^5.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive_flutter: ^1.1.0
  
  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.2.1
  image_picker: ^1.0.5
  camera: ^0.10.5
  
  # Notifications
  flutter_local_notifications: ^17.0.0
  
  # Maps
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0
  
  # Forms
  flutter_form_builder: ^10.0.0
  form_builder_validators: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/