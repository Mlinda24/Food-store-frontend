name: foodie_express_mobile
description: A food ordering and delivery system
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Styling
  google_fonts: ^8.1.0
  flutter_svg: ^2.2.4
  
  
  # State Management
  provider: ^6.1.5+1
  
  # Routing - Updated to latest
  go_router: ^17.2.3
  
  # Storage
  shared_preferences: ^2.5.5
  
  # Icons
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0  # Updated to latest

flutter:
  uses-material-design: true

