name: foodie_express_mobile
description: A food delivery mobile application with distance-based delivery fees and mobile money payments
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # ============================================
  # GROUP 1: UI & STYLING DEPENDENCIES
  # ============================================
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  badges: ^3.1.2
  lottie: ^2.7.0
  permission_handler: ^11.0.1
  
  # ============================================
  # GROUP 2: IMAGE HANDLING DEPENDENCIES
  # ============================================
  cached_network_image: ^3.3.0
  image_picker: ^1.0.5
  camera: ^0.10.5
  path: ^1.9.0
  cross_file: ^0.3.4
  
  # ============================================
  # GROUP 3: STATE MANAGEMENT & NAVIGATION
  # ============================================
  provider: ^6.1.1
  go_router: ^13.0.1
  
  # ============================================
  # GROUP 4: NETWORKING & LOCAL STORAGE
  # ============================================
  dio: ^5.4.0
  http: ^1.1.0
  shared_preferences: ^2.2.2
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  url_launcher: ^6.2.1
  
  # ============================================
  # GROUP 5: NOTIFICATIONS, MAPS & LOCATION
  # ============================================
  flutter_local_notifications: ^17.0.0
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0
  
  # ============================================
  # GROUP 6: FORM & VALIDATION
  # ============================================
  flutter_form_builder: ^10.0.0
  form_builder_validators: ^11.3.0
  google_fonts: ^8.0.2
  webview_flutter: ^4.13.1
  
  # ============================================
  # GROUP 7: PAYMENT INTEGRATION
  # ============================================
  # For PayChangu mobile money integration
  # No additional packages needed as we use HTTP directly
  
  # Optional: For more payment options in the future
  # flutter_paystack: ^1.0.7
  # flutterwave_standard: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
        - asset: assets/fonts/Poppins-BlackItalic.ttf
          weight: 900
          style: italic